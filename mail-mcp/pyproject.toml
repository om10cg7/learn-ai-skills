[project]
name = "mail-mcp"
version = "0.2.0"
description = "IMAP対応メール送受信MCPサーバー（読み取り・下書き・整理。送信なし）"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0,<3",
    "imap-tools>=1.10,<2",
    "pydantic>=2.5,<3",
    "pyyaml>=6.0,<7",
    "msal>=1.30,<2",
    "google-auth>=2.30,<3",
    "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mail-mcp = "mail_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: GreenMail など実サーバーが必要なテスト"]
addopts = "-m 'not integration'"
